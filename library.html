<!doctype html><html><head><meta charset="utf-8"><title>Bookmarking Extension</title><link rel="stylesheet" href="library.css"></head><body>
<header><h1>📚 Bookmarking Extension</h1><input id="q" type="search" placeholder="Search titles, notes, moments…">
<select id="ty"><option value="">All types</option><option>video</option><option>image</option><option>gif</option><option>page</option></select>
<button id="ex">Export backup</button><button id="im">Import</button><input id="fi" type="file" accept=".json" hidden></header><div id="banner" hidden></div>
<div class="wrap"><aside id="side"><div class="sh"><b>Folders</b><button id="nf" title="New folder">＋ Folder</button></div><div id="tree"></div></aside><div id="divider" role="separator" aria-orientation="vertical"><button id="sbtog" title="Hide sidebar"></button></div><section><div id="bar"><button id="back" title="Back to parent folder"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M11 5l-7 7 7 7"/></svg></button><button id="fwd" title="Forward"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg></button><span class="sp"></span><button id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-4"/></svg></button><button id="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h4"/></svg></button><button id="addf" title="New folder here"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button><button id="sel" title="Select items"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></button><button id="more" title="Folder options"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button></div><nav id="crumbs"></nav><div id="subs"></div><div id="chips"></div><main id="grid"></main></section></div><div id="selbar" hidden></div><dialog id="dlg"></dialog><dialog id="modal"></dialog>
<script src="db.js"></script><script src="library.js"></script></body></html>
